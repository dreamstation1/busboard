<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>버스 도착 전광판</title>
<style>
  /* 레이아웃: 전광판이 맨 위를 꽉 채우고, 조작부는 보드 뒷면처럼 그 아래에 조용히 놓인다. */
  :root {
    color-scheme: dark;
    --bg: #101214;
    --panel: #181b1f;
    --line: #2c3137;
    --fg: #e8eaed;
    --muted: #98a1ab;
    --amber: #ffc83d;
    --live: #4ade80;
    --warn: #ff8a5c;
    --sans: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 32px;
  }
  main { max-width: 1056px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

  /* 전광판 케이스 */
  #case { background: #050505; border: 1px solid #000; border-radius: 6px; padding: clamp(6px, 1.4vw, 14px); box-shadow: inset 0 0 0 1px #262a2f, 0 10px 30px rgba(0,0,0,.5); }
  #led { display: block; max-width: 100%; height: auto; margin: 0 auto; image-rendering: pixelated; background: #000; }
  #case:fullscreen { display: flex; align-items: center; justify-content: center; border: 0; border-radius: 0; padding: 0; background: #000; box-shadow: none; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grow { flex: 1 1 200px; min-width: 0; }
  #status { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13px; }
  #status i { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
  #status.live i { background: var(--live); }
  #status.bad i { background: var(--warn); }

  button, select, input { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; }
  input, select { width: 100%; min-width: 0; }
  button { cursor: pointer; white-space: nowrap; }
  button:hover { border-color: #4a525b; }
  button[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: #1a1400; font-weight: 700; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  details { border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: var(--muted); }
  .grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); padding-top: 14px; }
  .group { display: grid; gap: 8px; align-content: start; min-width: 0; }
  .group h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0; }
  .note { color: var(--muted); font-size: 13px; margin: 0; overflow-wrap: anywhere; }
  label.check { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
  label.check input { width: auto; }
  code { font-size: 12px; }
</style>
</head>
<body>
<main>
  <div id="case"><canvas id="led" width="1024" height="256" aria-label="버스 도착 LED 전광판"></canvas></div>

  <div class="bar">
    <button id="down" title="보드 DOWN 버튼 (왼쪽 화살표 키)">◀ 이전</button>
    <div class="grow"><select id="station" aria-label="정류장"></select></div>
    <button id="up" title="보드 UP 버튼 (오른쪽 화살표 키)">다음 ▶</button>
    <button id="sound" aria-pressed="false">안내방송 켜기</button>
    <button id="full">전체화면</button>
  </div>
  <div class="bar">
    <span id="status"><i></i><span id="statusText">시작하는 중</span></span>
    <span id="speaking" class="note"></span>
  </div>

  <details>
    <summary>보드 설정</summary>
    <div class="grid">
      <section class="group">
        <h2>정류장 직접 입력</h2>
        <form id="customForm" class="group">
          <input id="ars" inputmode="numeric" placeholder="정류소 ARS 번호" aria-label="정류소 ARS 번호">
          <input id="arsName" placeholder="표시 이름" aria-label="표시 이름">
          <button>적용</button>
        </form>
      </section>
      <section class="group">
        <h2>노선 조회</h2>
        <form id="queryForm" class="group">
          <input id="route" placeholder="예: 6640B" aria-label="노선 번호">
          <label class="check"><input type="checkbox" id="pin"> 이 노선을 화면에 고정</label>
          <button>남은 시간 보기</button>
        </form>
        <p class="note" id="queryResult"></p>
        <button id="unpin" hidden>고정 해제</button>
      </section>
      <section class="group">
        <h2>전광판</h2>
        <div class="bar">
          <button id="power" aria-pressed="true">전원 켜짐</button>
          <button id="refresh">지금 갱신</button>
        </div>
        <form id="noticeForm" class="group">
          <input id="notice" placeholder="15초 동안 띄울 공지" aria-label="공지 문구">
          <button>공지 보내기</button>
        </form>
      </section>
      <section class="group">
        <h2>안내방송</h2>
        <select id="mode" aria-label="송출 방식">
          <option value="2">2번: t → 번호 → y</option>
          <option value="1">1번: 버스입니다 → 번호 → 잠시후</option>
        </select>
        <label class="check"><input type="checkbox" id="letters" checked> 노선 문자 읽기</label>
        <button id="testSound">방송 시험</button>
      </section>
      <section class="group">
        <h2>실시간 연결</h2>
        <form id="apiForm" class="group">
          <input id="api" type="url" placeholder="중계 서버 주소" aria-label="중계 서버 주소">
          <button>연결</button>
        </form>
        <button id="apiOff" hidden>시연 데이터로 돌아가기</button>
        <p class="note">버스 API는 https를 지원하지 않아서 이 사이트에서 바로 부를 수 없습니다. 연결 방법은 README를 보세요.</p>
      </section>
    </div>
  </details>
</main>
<script src="data.js"></script>
<script src="services.js"></script>
<script src="board.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const canvas = $('led'), ctx = canvas.getContext('2d');
  const B = window.Board, S = window.BoardSource, A = window.BoardAudio;

  /* LED 패널 표현: 프레임을 128x32로 만든 뒤 확대하고, 둥근 LED 구멍이 뚫린 마스크를 덮는다. */
  const small = document.createElement('canvas');
  small.width = B.W; small.height = B.H;
  const sctx = small.getContext('2d');
  const img = sctx.createImageData(B.W, B.H);
  const mask = document.createElement('canvas');
  let last = null;

  // Protomatter 4비트 깊이: 565 색의 상위 4비트만 밝기로 쓰인다.
  // 모니터에서 눈이 덜 부시도록 밝기를 낮춘다. ?bright=100 이면 원래 밝기다.
  const bright = Math.min(100, Math.max(10, Number(new URLSearchParams(location.search).get('bright')) || 80)) / 100;
  const lv = new Uint8Array(16).map((_, i) => i * 17 * bright);
  function paint(fb) {
    last = fb;
    const d = img.data;
    for (let i = 0, p = 0; i < fb.length; i++, p += 4) {
      const c = fb[i];
      d[p] = lv[c >> 12]; d[p + 1] = lv[(c >> 7) & 15]; d[p + 2] = lv[(c >> 1) & 15]; d[p + 3] = 255;
    }
    sctx.putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, canvas.width, canvas.height);
    ctx.drawImage(mask, 0, 0);
  }
  function resize() {
    const holder = canvas.parentElement, cs = getComputedStyle(holder);
    const box = document.fullscreenElement ? window.innerWidth : holder.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const dpr = window.devicePixelRatio || 1;
    const pitch = Math.max(3, Math.floor(box * dpr / B.W));
    canvas.width = pitch * B.W; canvas.height = pitch * B.H;
    // 화면 픽셀과 1:1로 맞춘다. 비율이 어긋나면 일부 LED 줄이 뭉개져서 글자가 지나갈 때 번쩍인다.
    canvas.style.width = `${canvas.width / dpr}px`;
    mask.width = canvas.width; mask.height = canvas.height;
    const tile = document.createElement('canvas');
    tile.width = tile.height = pitch;
    const t = tile.getContext('2d');
    t.fillStyle = '#000'; t.fillRect(0, 0, pitch, pitch);
    t.globalCompositeOperation = 'destination-out';
    t.beginPath(); t.arc(pitch / 2, pitch / 2, pitch * 0.43, 0, Math.PI * 2); t.fill();
    const m = mask.getContext('2d');
    m.clearRect(0, 0, mask.width, mask.height);
    m.fillStyle = m.createPattern(tile, 'repeat');
    m.fillRect(0, 0, mask.width, mask.height);
    if (last) paint(last);
  }
  B.setShow(paint);
  window.addEventListener('resize', resize);
  document.addEventListener('fullscreenchange', resize);
  resize();

  /* 정류장 */
  const sel = $('station');
  B.stationNms.forEach((n, i) => sel.add(new Option(`${n} · ${B.stationIds[i]}`, i)));
  const customOpt = new Option('직접 입력한 정류장', 7);
  customOpt.hidden = true; sel.add(customOpt);
  const syncStation = () => { sel.value = B.stationIdx; customOpt.text = `${B.stationName} · ${B.arsId}`; };
  sel.addEventListener('change', () => B.setStation(+sel.value));
  $('up').addEventListener('click', () => { B.up(); syncStation(); });
  $('down').addEventListener('click', () => { B.down(); syncStation(); });
  document.addEventListener('keydown', e => {
    if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight') { B.up(); syncStation(); }
    if (e.key === 'ArrowLeft') { B.down(); syncStation(); }
  });
  $('customForm').addEventListener('submit', e => { e.preventDefault(); B.setCustom($('ars').value, $('arsName').value); syncStation(); });

  /* 소리 */
  $('sound').addEventListener('click', e => {
    const on = !A.settings.enabled;
    A.enable(on);
    e.currentTarget.setAttribute('aria-pressed', on);
    e.currentTarget.textContent = on ? '안내방송 켜짐' : '안내방송 켜기';
  });
  $('mode').addEventListener('change', e => { A.settings.mode = +e.target.value; });
  $('letters').addEventListener('change', e => { A.settings.speakLetters = e.target.checked; });
  $('testSound').addEventListener('click', () => { A.enable(A.settings.enabled); A.test(); });
  A.onSpeak = text => { $('speaking').textContent = text ? `방송 중: ${text}` : ''; };

  /* 전체화면 */
  $('full').addEventListener('click', () => {
    const el = $('case');
    if (document.fullscreenElement) document.exitFullscreen();
    else if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  });

  /* 보드 설정 */
  $('queryForm').addEventListener('submit', e => {
    e.preventDefault();
    $('queryResult').textContent = B.query($('route').value, $('pin').checked);
    $('unpin').hidden = !B.pinned;
  });
  $('unpin').addEventListener('click', e => { B.unpin(); e.currentTarget.hidden = true; $('pin').checked = false; $('queryResult').textContent = ''; });
  $('power').addEventListener('click', e => {
    const on = !B.power;
    B.setPower(on);
    e.currentTarget.setAttribute('aria-pressed', on);
    e.currentTarget.textContent = on ? '전원 켜짐' : '전원 꺼짐';
  });
  $('refresh').addEventListener('click', () => B.refresh());
  $('noticeForm').addEventListener('submit', e => { e.preventDefault(); B.notice($('notice').value); });

  /* 데이터 출처 표시 */
  function renderStatus() {
    const live = S.mode === 'live';
    $('status').className = S.error ? 'bad' : live ? 'live' : '';
    $('statusText').textContent = (live ? '실시간 버스 정보' : '시연 데이터 (실제 도착 정보가 아닙니다)') + (S.error ? ` · ${S.error}` : '');
    $('apiOff').hidden = !live || !S.base;
  }
  S.onChange = renderStatus;
  $('apiForm').addEventListener('submit', async e => {
    e.preventDefault();
    try { await S.connect($('api').value); B.refresh(); }
    catch (err) { S.set(S.mode, S.base, '이 주소에 연결하지 못했습니다'); }
  });
  $('apiOff').addEventListener('click', () => { S.disconnect(); B.refresh(); });

  B.boot();
})();
</script>
</body>
</html>
